# Example Slime Training Configuration
# Qwen3-4B with GRPO (Group Relative Policy Optimization)
# Using FSDP Backend
#
# Usage:
#   python train.py --train-yaml examples/configs/qwen3-4B-grpo.yaml
#
# CLI arguments can override any value in this file:
#   python train.py --train-yaml examples/configs/qwen3-4B-grpo.yaml --lr 2e-6

# =============================================================================
# Cluster Configuration
# =============================================================================
cluster:
  actor_num_nodes: 1
  actor_num_gpus_per_node: 2
  rollout_num_gpus: 2  # Required: total GPUs for rollout
  rollout_num_gpus_per_engine: 2
  colocate: false
  # offload_train: true  # Automatically set when colocate=true
  # offload_rollout: true

# =============================================================================
# Training Backend Configuration
# =============================================================================
train:
  train_backend: fsdp  # Only FSDP is supported (Megatron backend disabled)
  # train_memory_margin_bytes: 1073741824  # 1GB default
  # qkv_format: thd  # Megatron-only setting, not used with FSDP

# =============================================================================
# Rollout (Inference) Configuration
# =============================================================================
rollout:
  hf_checkpoint: /root/Qwen3-4B/
  rollout_temperature: 1.0
  rollout_top_p: 1.0
  rollout_max_response_len: 8192
  rollout_max_context_len: 16384
  rollout_shuffle: true
  rollout_seed: 42

# =============================================================================
# Data Configuration
# =============================================================================
data:
  prompt_data: /root/dapo-math-17k/dapo-math-17k.jsonl
  input_key: prompt
  label_key: label
  apply_chat_template: true

  # Batch sizes
  rollout_batch_size: 32
  n_samples_per_prompt: 8
  global_batch_size: 256
  # num_steps_per_rollout: 1  # Alternative: set steps instead of global_batch_size

  # Dynamic batching (recommended for variable length sequences)
  balance_data: true
  use_dynamic_batch_size: true
  max_tokens_per_gpu: 9216

  # Training iterations
  num_rollout: 256
  # num_epoch: 3  # Alternative: use epochs instead of num_rollout

# =============================================================================
# Algorithm Configuration (GRPO)
# =============================================================================
algorithm:
  # Checkpoints
  ref_load: /root/Qwen3-4B/
  load: /root/Qwen3-4B/
  save: /root/Qwen3-4B-checkpoints/
  save_interval: 100

  # GRPO settings
  advantage_estimator: grpo
  grpo_std_normalization: true  # Dr.GRPO
  rewards_normalization: true

  # KL divergence
  use_kl_loss: false
  kl_loss_coef: 0.0
  kl_loss_type: low_var_kl

  # PPO clipping
  eps_clip: 0.2
  eps_clip_high: 0.28

  # Optimizer
  lr: 1e-6
  clip_grad: 1.0
  seed: 42

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  eval_interval: 100
  n_samples_per_eval_prompt: 16
  eval_max_response_len: 16384
  eval_top_p: 1.0

  # Evaluation datasets
  datasets:
    - name: aime
      path: /root/aime-2024/aime-2024.jsonl
      rm_type: deepscaler
      n_samples_per_eval_prompt: 16

# =============================================================================
# Reward Model Configuration
# =============================================================================
reward:
  rm_type: deepscaler
  # For custom reward functions:
  # custom_rm_path: my_module.my_reward_function

# =============================================================================
# Logging Configuration
# =============================================================================
wandb:
  use_wandb: false
  wandb_project: slime-qwen3-grpo
  wandb_group: experiments
  log_passrate: true

tensorboard:
  use_tensorboard: false

# =============================================================================
# SGLang Configuration
# =============================================================================
sglang:
  sglang_mem_fraction_static: 0.7
